name: Validate Unraid DockerMan templates
on:
  push:
    paths:
      - 'templates/**'
      - '.github/workflows/validate-templates.yml'
  pull_request:
    paths:
      - 'templates/**'
      - '.github/workflows/validate-templates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parse all templates and check Trades configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          templates = sorted(Path("templates").glob("*.xml"))
          assert templates, "No templates found"
          for file in templates:
              root = ET.parse(file).getroot()
              assert root.tag == "Container", file
              assert root.attrib.get("version") == "2", file
              assert root.findtext("Repository"), file
              assert root.findtext("Icon"), file
              assert root.findtext("WebUI"), file
              print("OK", file)

          trades = ET.parse("templates/cngi-trades.xml").getroot()
          assert trades.findtext("Name") == "CNGI-Trades"
          assert trades.findtext("Repository") == "ghcr.io/jabbadahutt762/cngi-trades:latest"
          assert trades.findtext("Network") == "bridge"
          assert trades.findtext("Privileged") == "false"
          ports = [c for c in trades.findall("Config") if c.get("Type") == "Port"]
          assert len(ports) == 1
          assert ports[0].get("Target") == "8080" and ports[0].get("Default") == "8191"
          variables = [c for c in trades.findall("Config") if c.get("Type") == "Variable"]
          targets = [c.get("Target") for c in variables]
          assert len(set(targets)) == len(targets), "Duplicate environment variables"
          paths = [c for c in trades.findall("Config") if c.get("Type") == "Path"]
          assert len(paths) == 1 and paths[0].get("Target") == "/data"
          assert paths[0].get("Default") == "/mnt/user/appdata/cngi-trades"
          assert all(c.get("Required") == "false" for c in variables)
          for name in ("ALLOWED_EMAILS", "SESSION_SECRET", "ENCRYPTION_KEY",
                       "OIDC_DISCOVERY_URL", "OIDC_CLIENT_ID", "OIDC_CLIENT_SECRET"):
              assert name not in targets, "Configuration belongs inside CNGI Trades: " + name
          db = [c for c in variables if c.get("Target") == "DATABASE_URL"]
          assert len(db) == 1
          assert db[0].get("Mask") == "true" and not (db[0].text or "").strip()
          assert trades.findtext("TemplateURL") == ("https://raw.githubusercontent.com/"
                 "JabbaDaHutt762/CNGI-Unraid-Templates/main/templates/cngi-trades.xml")
          print("CNGI Trades first-run (port and appdata) validation passed")
          PY
